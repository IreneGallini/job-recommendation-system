# Company watchlist for European internship scraping.
#
# Each entry's `ats` field must be one of: greenhouse, lever, ashby, workday,
# smartrecruiters, personio, workable, teamtailor.
#
# Every company below was verified live (2026-09-28): its actual careers
# page was checked to confirm which ATS it uses and to find the right
# slug/tenant, and the corresponding public API was hit directly. This is a
# small, high-confidence seed — see CLAUDE.md for how to add more.
#
# category: big-tech | startup | pharma-biotech | finance | consulting
# priority: high | normal  (high = Milan-based, Italian, or otherwise
#   especially relevant — surfaces first in the README and site)

- name: Scalapay
  ats: greenhouse
  slug: scalapaysrl
  category: finance
  priority: high
  # Milan-based BNPL fintech; public careers page is on
  # job-boards.eu.greenhouse.io but the API host is unchanged.

- name: ION Group
  ats: lever
  slug: ion
  category: finance
  priority: high
  # Italian-founded fintech (Andrea Pignataro), large Milan/Trento presence.

