  search_text: intern
  category: big-tech
  priority: normal
  # Carried over from the old US-only nvidia_careers.py scraper.

- name: Mistral AI
  ats: ashby
  slug: mistral.ai
  category: startup
  priority: high
  # Paris-based frontier AI lab; EU-wide hiring including Milan.

- name: Stripe
  ats: greenhouse
