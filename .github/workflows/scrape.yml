name: Scrape Internships

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:       # allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch full history so the bot push isn't blocked by branch protection
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        # To target a different repo/branch, add:
        #     SIMPLIFY_README_URL: https://raw.githubusercontent.com/SimplifyJobs/Summer2028-Internships/dev/README.md
        # Adzuna runs only on the 00:00 UTC run (free-tier quota); skipped if
        # the secrets aren't set.
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python main.py

      - name: Commit updated CSV and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add internships.csv README.md last_run_counts.json docs/
          git diff --cached --quiet || git commit -m "chore: update internships.csv and README [skip ci]"
          git push
