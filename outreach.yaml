# Outreach targets — rendered on the site's Outreach tab (docs/outreach.json
# is regenerated from this file every run, with each company's open
# postings attached by matching `company` to the watchlist name).
#
# Seeded at company level with LinkedIn *people-search* links, not named
# individuals. When you find a specific person, add `name:` (and point
# `link:` at their profile). Contact status and notes are tracked on the
# site, in your browser.
#
# Fields: company, contact_role, why, link, careers_url, priority
#   (high|normal), notes, name (optional), id (optional; defaults to
#   company + contact_role — set it explicitly before renaming either, or
#   the site loses that entry's saved status).

